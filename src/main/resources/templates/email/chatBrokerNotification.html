<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="hr">
<!-- Internal broker ping (Mario 20.7.2026: "neka mi dodje notification, ne mogu
     pratit admin cijelo vrijeme"). Plain and fast on purpose — no brand shell,
     it goes to the team, not a customer. -->

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat obavijest | Boat4You</title>
</head>

<body style="margin:0;padding:24px;background:#f4f6fb;font-family:Arial,Helvetica,sans-serif;color:#141857;">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e3e7f2;border-radius:10px;padding:24px;">
    <p style="margin:0 0 4px;font-size:12px;letter-spacing:1px;color:#6b7280;text-transform:uppercase;">Boat4You chat</p>
    <h2 style="margin:0 0 16px;font-size:20px;color:#141857;">
      Posjetitelj čeka odgovor u chatu <span th:text="'#' + ${sessionId}">#0</span>
    </h2>

    <table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;font-size:14px;line-height:1.6;">
      <tr th:if="${visitorName != ''}">
        <td style="color:#6b7280;padding-right:12px;white-space:nowrap;vertical-align:top;">Ime</td>
        <td th:text="${visitorName}"></td>
      </tr>
      <tr th:if="${visitorEmail != ''}">
        <td style="color:#6b7280;padding-right:12px;white-space:nowrap;vertical-align:top;">E-mail</td>
        <td th:text="${visitorEmail}"></td>
      </tr>
      <tr th:if="${lastMessage != ''}">
        <td style="color:#6b7280;padding-right:12px;white-space:nowrap;vertical-align:top;">Zadnja poruka</td>
        <td th:text="${lastMessage}"></td>
      </tr>
    </table>

    <a th:href="${adminUrl}"
       style="display:inline-block;margin-top:20px;background:#2856ff;color:#ffffff;text-decoration:none;font-weight:bold;font-size:14px;padding:12px 22px;border-radius:8px;">
      Otvori chat u adminu
    </a>

    <p style="margin:20px 0 0;font-size:12px;color:#6b7280;">
      Posjetitelj odgovor vidi u istom chat prozoru na www.boat4you.com — dok ne odgovorite, AI se ne miješa.
    </p>
  </div>
</body>

</html>
