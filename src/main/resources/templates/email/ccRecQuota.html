<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI isključen | Boat4You</title>
</head>
<body style="margin:0; padding:24px; background-color:#f4f6fb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; color:#0f172a;">
  <table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px; background-color:#ffffff; border-radius:12px;">
    <tr>
      <td style="padding:28px 28px 8px 28px;">
        <h1 th:text="${headline}" style="margin:0 0 16px 0; font-size:20px; line-height:1.3;">Snimke posjeta: disk se puni</h1>
        <p style="margin:0 0 8px 0; font-size:14px;"><strong>Zauzeto:</strong> <span th:text="${used}">31,5 GB</span> od <span th:text="${quota}">45 GB</span> (<span th:text="${percent}">70</span> %)</p>
        <p style="margin:0 0 20px 0; font-size:14px; line-height:1.5;">Na 100 % novi paketi snimki se odbijaju (507) dok brisanje starih od 60 dana ne oslobodi mjesto. Postojeće snimke i činjenice za heatmape ostaju.</p>
        <p style="margin:0 0 24px 0;">
          <a th:href="${adminUrl}" href="https://admin.boat4you.com/contact-center"
            style="display:inline-block; padding:10px 18px; background-color:#2856ff; color:#ffffff; border-radius:8px; font-size:14px; text-decoration:none;">Otvori admin</a>
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px 24px 28px; font-size:11px; color:#64748b;" th:text="'© ' + ${currentYear} + ' Boat4You'">© Boat4You</td>
    </tr>
  </table>
</body>
</html>
