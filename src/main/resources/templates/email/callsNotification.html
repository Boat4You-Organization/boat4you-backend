<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hr">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nika | Boat4You</title>
</head>
<body style="margin:0; padding:24px; background-color:#f4f6fb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; color:#0f172a;">
  <table role="presentation" align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px; background-color:#ffffff; border-radius:12px;">
    <tr>
      <td style="padding:28px 28px 8px 28px;">
        <h1 th:text="${headline}" style="margin:0 0 16px 0; font-size:20px; line-height:1.3;">Nika: spreman rezervirati</h1>
        <p th:if="${client != ''}" style="margin:0 0 8px 0; font-size:14px;"><strong>Klijent:</strong> <span th:text="${client}">Ana Horvat</span></p>
        <p th:if="${site != ''}" style="margin:0 0 8px 0; font-size:14px;"><strong>Stranica:</strong> <span th:text="${site}">Boat4You</span></p>
        <p style="margin:0 0 8px 0; font-size:14px;"><strong>Ishod:</strong> <span th:text="${outcome}">spreman rezervirati</span></p>
        <p th:if="${callbackTime != ''}" style="margin:0 0 8px 0; font-size:14px;"><strong>Povratni poziv:</strong> <span th:text="${callbackTime}">sutra u 10</span></p>
        <p th:if="${summary != ''}" style="margin:0 0 20px 0; font-size:14px; line-height:1.5;" th:text="${summary}">Sažetak razgovora.</p>
        <p style="margin:0 0 24px 0;">
          <a th:href="${adminUrl}" href="https://admin.boat4you.com/call-center/calls"
            style="display:inline-block; padding:10px 18px; background-color:#2856ff; color:#ffffff; border-radius:8px; font-size:14px; text-decoration:none;">Otvori u Call centru</a>
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px 24px 28px; font-size:11px; color:#64748b;" th:text="'© ' + ${currentYear} + ' Boat4You'">© Boat4You</td>
    </tr>
  </table>
</body>
</html>
