name: CI

# Faza 0 (DevOps modernizacija) — gating CI for the backend, which previously
# had no GitHub workflow at all. Compile (incl. OpenAPI codegen) + tests +
# detekt/ktlint, a secret scan (gitleaks, gating) and a dependency/filesystem
# vulnerability scan (Trivy, report-only for now). Enable branch protection on
# `main` requiring this check so a red build blocks merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    name: Build · Test · Lint · Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the secret scan below walks the commit range of the PR/push.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Runs OpenAPI codegen -> compile -> detekt + ktlint -> tests
      # (Testcontainers starts Postgres via the runner's Docker daemon) ->
      # assemble. Tests + compile gate the build; detekt/ktlint currently have
      # ignoreFailures=true in build.gradle.kts so they surface but don't block
      # yet (flip that off once the existing violations are cleaned up).
      - name: Build, test & lint
        run: ./gradlew build --no-daemon --stacktrace

      # Secret scan — GATING. Scans the commits in the PR/push (not full
      # history), so it blocks NEW secrets from entering the repo. Runs the
      # open-source gitleaks CLI (MIT) directly, pinned by checksum:
      # gitleaks-action refuses to run for an organization without a
      # GITLEAKS_LICENSE key.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --quiet
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          # A new branch or a force-push has no usable "before" commit: scan the pushed commit alone.
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .

      # Dependency + filesystem vulnerability scan. Report-only for now
      # (exit-code 0); flip to '1' to make HIGH/CRITICAL block merges once the
      # current baseline has been triaged.
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
